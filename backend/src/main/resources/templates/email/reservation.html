<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#faf6f0;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td align="center" style="padding:24px 12px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
            <tr><td style="background:#2e1b12;color:#ffffff;padding:18px 24px;font-size:20px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-family:Georgia,serif;border-radius:12px 12px 0 0;">
                Reservo
            </td></tr>
            <tr><td style="padding:24px;">
                <h2 style="margin:0 0 12px;" th:text="${heading}">Reservation update</h2>
                <p>Hello <span th:text="${event.recipientName()}">Guest</span>,</p>
                <p th:text="${intro}">Here is the latest on your reservation.</p>
                <table role="presentation" cellpadding="6" cellspacing="0" style="background:#faf6f0;border-radius:8px;width:100%;">
                    <tr><td><strong>Restaurant</strong></td><td th:text="${event.restaurantName()}">Restaurant</td></tr>
                    <tr><td><strong>Date</strong></td><td th:text="${#temporals.format(event.date(), 'EEEE, d MMMM yyyy')}">Date</td></tr>
                    <tr><td><strong>Time</strong></td><td th:text="${#temporals.format(event.time(), 'HH:mm')}">19:00</td></tr>
                    <tr><td><strong>Party size</strong></td><td th:text="${event.partySize()}">2</td></tr>
                    <tr><td><strong>Status</strong></td><td th:text="${event.status()}">PENDING</td></tr>
                    <tr><td><strong>Reference</strong></td><td th:text="'#' + ${event.reservationId()}">#1</td></tr>
                </table>
                <p style="margin-top:20px;">
                    <a th:href="${frontendUrl} + '/reservations'"
                       style="background:#d9741f;color:#ffffff;padding:10px 18px;border-radius:8px;text-decoration:none;">
                        View my reservations
                    </a>
                </p>
                <p style="color:#6b7280;font-size:13px;">Thank you for using Reservo.</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
