server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  forward-headers-strategy: framework

spring:
  application:
    name: reservo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:imena1234}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/reservo}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-1234}
    expiration-minutes: 120
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  reservation:
    duration-minutes: 90
    slot-step-minutes: 30
  notifications:
    email-enabled: ${EMAIL_ENABLED:false}
    from: no-reply@reservo.local
  seed:
    admin-email: ${ADMIN_EMAIL:admin@reservo.local}
    admin-password: ${ADMIN_PASSWORD:Admin@123}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
