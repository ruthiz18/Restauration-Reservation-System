spring.application.name=restaurant-reservation-api
server.port=8080

# ---------- PostgreSQL (default profile) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=postgres
spring.datasource.password=imena1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Return a clean 404 body instead of the default error page
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Business rule configuration
restaurant.reservation.slot-duration-minutes=120
restaurant.reservation.opening-time=09:00
restaurant.reservation.closing-time=23:00
